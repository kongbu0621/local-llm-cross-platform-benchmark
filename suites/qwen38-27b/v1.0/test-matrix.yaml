    - 32768
    - 131072
    - 262144
  deep_dive:
    - 393216
    - 524288
    - 786432
    - 1048576

quality_core:
  - gpqa_diamond
  - ifbench
  - humaneval_plus
  - livecodebench
  - longbench_v2
  - niah_v2
  - nolima

performance_isolation:
  concurrency: 1
  cache_state: cold
  prefix_cache: false
  speculative_decoding: false
  mtp: false
  exact_token_payload: true
  report_actual_input_tokens: true
  report_actual_output_tokens: true

stability:
  e2e_32k:
    input_tokens: 32768
    output_tokens: 32768
    concurrency: 1
    cache_state: cold
    require_full_output_for_pass: true

comparison_modes:
  - strict_comparable
  - platform_optimized

required_metrics:
  - pp_tps
  - ttft_ms
  - decode_tps
  - e2e_wall_ms
  - peak_device_memory_bytes
  - peak_host_memory_bytes
  - cache_state
  - concurrency
  - stability_status

policy:
  actual_context_only: true
  preserve_failures: true
  no_silent_dataset_changes: true
  no_silent_model_revision_changes: true
  restricted_dataset_content_in_public_repo: false
