name: Validate benchmark repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Validate benchmark contracts and public-repo safety
        run: python scripts/validate_repo.py

      - name: Compile decision-system validators
        run: python -m py_compile scripts/validate_decision_system.py scripts/validate_agentic_coding_evidence.py

      - name: Validate decision-system schemas and semantics
        run: python scripts/validate_decision_system.py

      - name: Validate external agentic-coding evidence
        run: python scripts/validate_agentic_coding_evidence.py
